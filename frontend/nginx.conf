# Serves the built SPA and forwards /api to the backend, so the browser only talks to one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # For the browser this is a same-origin call: drop Origin, so the backend doesn't treat it as a
        # cross-origin request (whatever host and port the app is opened on).
        proxy_set_header Origin "";
        proxy_read_timeout 30s;
    }

    # Built files have a content hash in their name: cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/pokemon/25, /local/7, ...) all load the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
