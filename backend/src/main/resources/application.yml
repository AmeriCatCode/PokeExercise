spring:
  application:
    name: pokedex
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pokedex}
    username: ${DB_USERNAME:pokedex}
    password: ${DB_PASSWORD:pokedex}
  jpa:
    # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # Loads the child lists (types, stats, tags, ...) of a whole page of Pokémon in a few queries,
      # instead of one query per Pokémon and list.
      hibernate.default_batch_fetch_size: 50

server:
  port: ${SERVER_PORT:8080}

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  connect-timeout: 2s
  read-timeout: ${POKEAPI_READ_TIMEOUT:5s}
  cache:
    max-size: ${POKEAPI_CACHE_MAX_SIZE:1000}
    ttl: ${POKEAPI_CACHE_TTL:24h}

security:
  jwt:
    # Base64-encoded key of at least 32 bytes. Empty: a random key per start (fine for local development).
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:1h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
