spring:
  application:
    name: pokedex
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  connect-timeout: 2s
  read-timeout: ${POKEAPI_READ_TIMEOUT:5s}
  cache:
    max-size: ${POKEAPI_CACHE_MAX_SIZE:1000}
    ttl: ${POKEAPI_CACHE_TTL:24h}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
